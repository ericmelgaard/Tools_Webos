name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  function:
    name: Supabase edge function
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Sync function secrets from GitHub Secrets
        env:
          LG_API_KEY: ${{ secrets.LG_API_KEY }}
          LG_API_SECRET: ${{ secrets.LG_API_SECRET }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            LG_API_KEY="$LG_API_KEY" \
            LG_API_SECRET="$LG_API_SECRET" \
            APP_PASSWORD="$APP_PASSWORD" \
            ALLOWED_ORIGIN="https://${{ github.repository_owner }}.github.io"
      - name: Deploy function
        run: supabase functions deploy lg-lookup --project-ref "$PROJECT_REF" --no-verify-jwt

  pages:
    name: GitHub Pages site
    needs: function
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the page at the Supabase function
        run: |
          echo "window.APP_CONFIG = { apiUrl: 'https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/lg-lookup' };" > site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
